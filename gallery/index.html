<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx · 像素特效库</title>
<meta name="description" data-i18n-content="description" content="由代码驱动的像素特效与动画，支持实时预览、配色调整和精灵图集导出。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub" id="subtitle">正在加载像素特效…</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener" data-i18n="github">GitHub 源码</a>
    <a href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener" data-i18n="skill">Claude Code 技能</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">patch.gg</a>
    <label class="language"><span data-i18n="language">语言</span>
      <select id="language" class="btn" aria-label="语言" data-i18n-aria-label="language">
        <option value="zh-CN" lang="zh-CN">简体中文</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" aria-label="特效分类" data-i18n-aria-label="categories"></div>
    <input id="q" type="search" placeholder="搜索中英文名称" aria-label="搜索特效" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="search" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden data-i18n="empty">没有找到匹配的特效。试试“火焰”“挥斩”或“循环”。</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big">
        <canvas id="big"></canvas>
        <video id="d-video" controls muted loop playsinline preload="none" hidden></video>
        <button class="close" id="d-close" type="button" data-i18n="close">关闭</button>
      </div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <a class="btn" id="d-package" download hidden data-i18n="downloadGodot">下载 Godot 资源包</a>
      <div id="d-live">
        <div class="controls">
          <div class="row"><label data-i18n="playback">播放</label><button class="btn" id="d-play" type="button">暂停</button><button class="btn" id="d-again" type="button" data-i18n="again">重播</button><span id="d-speed" class="row"></span></div>
          <div class="row"><label data-i18n="backdrop">背景</label><span id="d-bg" class="row"></span></div>
          <div class="row"><label for="d-pal" data-i18n="palette">配色</label><select class="btn" id="d-pal" aria-label="配色" data-i18n-aria-label="palette"></select><button class="btn" id="d-seed" type="button" data-i18n="seed">随机变化</button></div>
          <div class="row" id="d-outcome-row" hidden><label data-i18n="outcome">模拟结果</label><span class="row" id="d-outcome"></span></div>
          <div class="row"><label data-i18n="show">显示</label><button class="btn" id="d-flip" type="button" data-i18n="mirror">镜像</button><button class="btn" id="d-actor" type="button" data-i18n="character">角色</button><button class="btn" id="d-make" type="button" data-i18n="spriteSheet">生成图集</button></div>
        </div>
        <div class="code-head"><span data-i18n="useIt">使用示例</span><span><a id="d-src" target="_blank" rel="noopener" data-i18n="source">查看源码</a> · <button class="btn" id="d-copy" type="button" data-i18n="copy">复制</button></span></div>
        <pre id="d-code"></pre>
      </div>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="app.js"></script>
</body>
</html>
